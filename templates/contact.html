{% extends 'master.html' %}

{% block title %} Contact {% endblock %}

{% block content %}
<section class="page-section page-top-space">
    <div class="container">
        <h2 class="page-section-heading text-center text-uppercase text-secondary mb-0">Contact Me</h2>
        {% include 'divider.html' %}

        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">

                {% if sent %}
                    <div class="alert alert-success text-center">
                        Thank you, {{ name }}! Your message was received.
                    </div>
                {% endif %}

                <form method="post" action="{% url 'contact' %}">
                    {% csrf_token %}

                    <div class="form-floating mb-3">
                        <input class="form-control" id="name" name="name" type="text" placeholder="Your name" required>
                        <label for="name">Full name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" required>
                        <label for="email">Email address</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input class="form-control" id="phone" name="phone" type="tel" placeholder="Phone">
                        <label for="phone">Phone number</label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="message" name="message" placeholder="Message" style="height: 10rem" required></textarea>
                        <label for="message">Message</label>
                    </div>

                    <button class="btn btn-primary btn-xl" type="submit">Send</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
