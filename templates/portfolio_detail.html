{% extends 'master.html' %}
{% load static %}

{% block title %}{{ item.title }} | {{ site_name }}{% endblock %}

{% block content %}
<section class="page-section page-top-space">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 text-center">
                <h2 class="page-section-heading text-uppercase text-secondary mb-0">{{ item.title }}</h2>
                {% include 'divider.html' %}

                <img class="img-fluid rounded mb-4" src="{% static item.image %}" alt="{{ item.title }}">
                <p class="lead mb-4">{{ item.description }}</p>

                <a href="{% url 'home' %}#portfolio" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-2"></i> Back to Portfolio
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
